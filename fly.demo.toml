# A public simulation demo of the engine on Fly.io: the paper exchange and scripted prices on
# Monad testnet's real block clock (ADR 0012, 0014). It never holds a real key and sends nothing
# to Perpl, so it needs no master key or egress IP. Steps: docs/DEPLOY.md, "Public demo".

app = "airbag-demo"
primary_region = "iad"

[build]
  dockerfile = "apps/engine/Dockerfile"

[env]
  ENGINE_MODE = "simulation"
  PERPL_NETWORK = "testnet"
  HOST = "0.0.0.0"
  PORT = "8787"
  DATABASE_PATH = "/data/airbag.db"
  CLIENT_IP_HEADER = "fly-client-ip"
  LOG_LEVEL = "info"

[mounts]
  source = "airbag_demo_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  # Visitors' dashboards stream from it; a stopped machine would look like a broken demo.
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/ready"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
